<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#18275f" />
    <meta name="description" content="LaIA — Liga Acadêmica de Inteligência Artificial da Universidade Federal de Sergipe. Conheça a comunidade, a atuação, a equipe e o Blog." />
    <title>LaIA — Inteligência Artificial na UFS</title>
    <link rel="icon" type="image/png" sizes="500x500" href="/assets/favicon-laia-dark.png" />
    <link rel="apple-touch-icon" href="/assets/favicon-laia-dark.png" />
    <script>
      try {
        const savedTheme = localStorage.getItem('laia-theme');
        document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- The official widget bootstraps itself; keep it outside React to avoid duplicate initialization. -->
    <script defer src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
